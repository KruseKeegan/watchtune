# Builds an unsigned WatchTune.ipa on a GitHub macOS runner. AltStore signs
# it with your Apple ID when it installs it, so no Apple developer account or
# Mac is needed. Every run uploads the .ipa as an artifact; runs on main also
# update the "latest" release, so the iPhone can download it directly.
name: iOS build

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Watch face tests
        run: node tests/test_watchface.js watch/watchtune.js

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build (unsigned)
        run: |
          cd ios
          xcodebuild -project WatchTune.xcodeproj -scheme WatchTune \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          cd ios
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/WatchTune.app Payload/
          zip -qry WatchTune.ipa Payload
          ls -l WatchTune.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: WatchTune-ipa
          path: ios/WatchTune.ipa

      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "WatchTune (latest build)" \
              --notes "Install WatchTune.ipa with AltStore. Built from main."
          gh release upload latest ios/WatchTune.ipa watch/watchtune.js --clobber
